# nginx runs inside the frontend container and does two jobs.
server {
    listen 80;

    # 1. Serves the built React files (HTML, JS, CSS).
    root /usr/share/nginx/html;
    index index.html;

    # React decides which page to show from the address (for example /kiosk).
    # Such a file does not exist on disk, so nginx answers with index.html and React takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Forwards everything under /api/ to the backend container.
    # "backend" is the service name in docker-compose.yml; Docker resolves it to the container.
    # Because the browser talks only to this address, the login cookie works without CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
